[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quarterwatt"
version = "1.1"
description = "Reproducible data lake for European and Turkish electricity markets, in quarter-hour detail from 2015"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Serhan Basturk" }]
requires-python = ">=3.10"
keywords = ["electricity market", "ENTSO-E", "day-ahead prices", "balancing", "energy data", "data pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "entsoe-py==0.8.1",
    "pandas>=2.1,<4",
    "numpy>=1.24",
    "pyarrow>=14",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "holidays>=0.40",
    "openpyxl>=3.1",
    "eptr2>=1.3",
    "demandlib>=0.2",
]

[project.urls]
Homepage = "https://quarterwatt.com"
Source = "https://github.com/serhanbasturk/quarterwatt"
Documentation = "https://github.com/serhanbasturk/quarterwatt/blob/main/docs/HANDBOOK.md"
Changelog = "https://github.com/serhanbasturk/quarterwatt/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["quarterwatt"]
